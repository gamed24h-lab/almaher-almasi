name: Temporary Trip Booking Count Patch

on:
  push:
    branches: [notify-trip-booking-count]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: notify-trip-booking-count
      - name: Apply targeted patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/modules/bookings/BookingEditor.jsx')
          s=p.read_text()
          old="const fresh=await refresh();await applySeatsAfterSave(fresh,bookingNumber);if(submitAction==='save_wa'){"
          new="const fresh=await refresh();await applySeatsAfterSave(fresh,bookingNumber);const tripBookings=(fresh?.bookings||[]).filter(b=>s(b.trip_id)===s(tripId)&&!['cancelled','refunded'].includes(low(b.status)));const tripBookingIds=new Set(tripBookings.map(b=>s(b.id)));const tripPassengerCount=(fresh?.passengers||[]).filter(p=>tripBookingIds.has(s(p.booking_id))&&!['cancelled','refunded'].includes(low(p.status))).length;notifyInfo(`الرحلة حتى الآن: ${tripBookings.length} ${tripBookings.length===1?'حجز':'حجوزات'} · ${tripPassengerCount} ${tripPassengerCount===1?'مسافر':'مسافرين'}.`);if(submitAction==='save_wa'){"
          if old not in s: raise SystemExit('save anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/modules/bookings/BookingEditor.jsx
          git commit -m "show trip booking totals after save" || exit 0
          git push origin HEAD:notify-trip-booking-count

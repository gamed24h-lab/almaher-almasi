name: Fix cancellation capabilities
on:
  push:
    branches:
      - wallet-cancellation-settlement
    paths:
      - .github/workflows/fix-cancellation-capabilities.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet-cancellation-settlement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-cancellation-capabilities.mjs
      - run: node --check worker/wallet-cancellation-index.js
      - name: Commit clean fix
        run: |
          rm -f scripts/fix-cancellation-capabilities.mjs .github/workflows/fix-cancellation-capabilities.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "align cancellation settlement permissions"
          git push origin HEAD:wallet-cancellation-settlement

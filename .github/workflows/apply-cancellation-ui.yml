name: Apply cancellation UI
on:
  push:
    branches:
      - wallet-cancellation-settlement
    paths:
      - .github/workflows/apply-cancellation-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wallet-cancellation-settlement
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply cancellation UI patch
        run: node scripts/apply-cancellation-ui.mjs
      - name: Validate worker entry
        run: node --check worker/wallet-cancellation-index.js
      - name: Validate app build
        run: |
          npm ci
          npm run build
      - name: Commit clean result
        run: |
          rm -f scripts/apply-cancellation-ui.mjs .github/workflows/apply-cancellation-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add cancellation settlement and wallet UI"
          git push origin HEAD:wallet-cancellation-settlement

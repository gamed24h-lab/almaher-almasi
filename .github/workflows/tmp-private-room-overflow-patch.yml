name: Temporary Private Room Overflow Patch

on:
  push:
    branches: [fix-private-room-overflow]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix-private-room-overflow
      - name: Apply targeted patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/modules/bookings/BookingEditor.jsx')
          s=p.read_text()
          old="function onlyDigits(v){return String(v||'').replace(/\\D/g,'')}"
          new=old+"\nfunction privateRoomCapacity(type){return ({single:1,double:2,triple:3,quad:4,quint:5})[String(type||'double')]||2}"
          if old not in s: raise SystemExit('BookingEditor helper anchor not found')
          s=s.replace(old,new,1)
          old2="const validation=validate(paid);if(validation){setErr(validation);return}const waWindow="
          new2="const validation=validate(paid);if(validation){setErr(validation);return}if(accommodation==='private'){const registeredCapacity=Math.max(1,Number(privateRooms||1))*privateRoomCapacity(privateRoomType);if(passengers.length>registeredCapacity){const overflow=passengers.length-registeredCapacity;const ok=confirm(`تنبيه سعة السكن الخاص:\nعدد المسافرين: ${passengers.length}\nالسعة المسجلة في الحجز: ${registeredCapacity} (${privateRooms} غرفة × ${privateRoomCapacity(privateRoomType)})\nيوجد ${overflow} ${overflow===1?'مسافر':'مسافرين'} خارج السعة المسجلة.\n\nيمكنك المتابعة، لكن التسكين التلقائي لن ينشئ غرفة إضافية من نفسه وسيبقى الزائد بدون تسكين حتى يضيف الموظف غرفة أو يعدل الحجز.\n\nهل تريد المتابعة وحفظ الحجز؟`);if(!ok)return}}const waWindow="
          if old2 not in s: raise SystemExit('BookingEditor save anchor not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path('src/modules/housing/Housing.jsx')
          s=p.read_text()
          old="const requested=Math.max(1,Number(b.private_rooms||snap.privateRooms||1));const targetCount=Math.max(requested,Math.ceil(bp.length/cap));"
          new="const requested=Math.max(1,Number(b.private_rooms||snap.privateRooms||1));const targetCount=requested;"
          if old not in s: raise SystemExit('Housing targetCount anchor not found')
          s=s.replace(old,new,1)
          old3="setBusy(true);setError('');setNotice('');let created=0,moved=0;try{"
          new3="setBusy(true);setError('');setNotice('');let created=0,moved=0,overflow=0;try{"
          if old3 not in s: raise SystemExit('Housing counters anchor not found')
          s=s.replace(old3,new3,1)
          old4="if(!target)throw new Error(`تعذر إيجاد سعة كافية للحجز ${b.booking_number||b.id}.`);if(current){"
          new4="if(!target){if(current){await api.moduleWrite({action:'update',table:'room_assignments',id:current.id,row:{status:'released'}});occ.set(s(current.hotel_room_id),Math.max(0,(occ.get(s(current.hotel_room_id))||1)-1));activeByPassenger.delete(s(p.id))}overflow++;continue}if(current){"
          if old4 not in s: raise SystemExit('Housing overflow anchor not found')
          s=s.replace(old4,new4,1)
          old5="await load();setNotice(`تم تجهيز السكن الخاص تلقائيًا: إنشاء ${created} غرفة وتوزيع ${moved} مسافرًا حسب كل حجز ونوع/عدد الغرف المسجل.`)"
          new5="await load();setNotice(overflow?`تم تجهيز السكن الخاص حسب الحجز فقط: إنشاء ${created} غرفة وتوزيع ${moved} مسافرًا. بقي ${overflow} ${overflow===1?'مسافر':'مسافرين'} بدون تسكين لأن السعة المسجلة في الحجز لا تكفي. أضف غرفة يدويًا أو عدل الحجز إذا لزم.`:`تم تجهيز السكن الخاص تلقائيًا: إنشاء ${created} غرفة وتوزيع ${moved} مسافرًا حسب نوع وعدد الغرف المسجل في كل حجز.`)"
          if old5 not in s: raise SystemExit('Housing notice anchor not found')
          s=s.replace(old5,new5,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/modules/bookings/BookingEditor.jsx src/modules/housing/Housing.jsx
          git commit -m "warn on private room overflow and cap auto housing" || exit 0
          git push origin HEAD:fix-private-room-overflow

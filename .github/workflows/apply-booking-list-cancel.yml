name: Apply booking list cancellation
on:
  push:
    branches: [ booking-list-cancel-permission ]
    paths:
      - 'scripts/patch-booking-list-cancel.cjs'
      - '.github/workflows/apply-booking-list-cancel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: booking-list-cancel-permission
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply cancellation row and permission patch
        run: node scripts/patch-booking-list-cancel.cjs
      - name: Build app
        run: npm run build
      - name: Commit clean result
        run: |
          rm -f scripts/patch-booking-list-cancel.cjs .github/workflows/apply-booking-list-cancel.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/bookings/Bookings.jsx src/modules/staff/Staff.jsx scripts/patch-booking-list-cancel.cjs .github/workflows/apply-booking-list-cancel.yml
          git commit -m "add booking list cancellation action and permission"
          git push origin HEAD:booking-list-cancel-permission

name: Apply payment split foundation
on:
  push:
    branches:
      - payment-wallet-cancel-foundation
    paths:
      - .github/workflows/apply-payment-splits-foundation.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: payment-wallet-cancel-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-payment-splits-foundation.mjs
      - name: Validate build
        run: |
          npm ci
          npm run build
      - name: Commit clean result
        run: |
          rm -f scripts/apply-payment-splits-foundation.mjs .github/workflows/apply-payment-splits-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add split payment collection foundation"
          git push origin HEAD:payment-wallet-cancel-foundation

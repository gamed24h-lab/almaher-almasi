name: Apply refund control permissions
on:
  push:
    branches: [refund-correction-wallet-withdrawal]
    paths: ['.github/workflows/apply-refund-control-permissions.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refund-correction-wallet-withdrawal
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch staff permissions
        run: node scripts/patch-refund-control-permissions.cjs
      - name: Validate worker syntax
        run: node --check worker/refund-control-index.js
      - name: Build app
        run: npm run build
      - name: Commit clean result
        run: |
          rm -f scripts/patch-refund-control-permissions.cjs .github/workflows/apply-refund-control-permissions.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/modules/staff/Staff.jsx scripts/patch-refund-control-permissions.cjs .github/workflows/apply-refund-control-permissions.yml
          git commit -m "add refund correction permissions"
          git push origin HEAD:refund-correction-wallet-withdrawal

name: Pricing Refactor Once

on:
  push:
    branches: [modular-trip-housing-pricing]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-trip-housing-pricing
      - name: Apply pricing patch once
        run: |
          if [ -f .pricing-refactor-applied ]; then exit 0; fi
          python3 scripts/apply-pricing-refactor.py
          touch .pricing-refactor-applied
      - name: Commit pricing patch
        run: |
          if git diff --quiet && git diff --cached --quiet; then exit 0; fi
          git config user.name "almaher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/bookings/BookingEditor.jsx src/modules/trips/Trips.jsx src/modules/destinations/Destinations.jsx worker/trip-destination-guard-index.js scripts/check-pricing.mjs .pricing-refactor-applied
          git diff --cached --check
          git commit -m "apply modular pricing refactor"
          git push origin HEAD:modular-trip-housing-pricing

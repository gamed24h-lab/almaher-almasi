name: Apply wallet page payment
on:
  push:
    branches: [customer-wallet-page-and-payments]
    paths:
      - 'scripts/apply-wallet-page-payment.mjs'
      - '.github/workflows/apply-wallet-page-payment.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: customer-wallet-page-and-payments
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply wallet UI and payment patch
        run: node scripts/apply-wallet-page-payment.mjs
      - name: Validate workers
        run: |
          node --check worker/wallet-cancellation-index.js
          node --check worker/wallet-payments-index.js
      - name: Validate app build
        run: npm run build
      - name: Commit clean result
        run: |
          rm -f scripts/apply-wallet-page-payment.mjs .github/workflows/apply-wallet-page-payment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'add customer wallet page and wallet booking payments'
          git push origin customer-wallet-page-and-payments

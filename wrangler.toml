name = "almaher-almasi"
main = "worker/booking-verify-index.js"
compatibility_date = "2026-08-21"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = false

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/.netlify/functions/*", "/health", "/healthz"]

# Keep existing Cloudflare dashboard Variables/Secrets.
# Required at runtime:
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
